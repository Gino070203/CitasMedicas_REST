spring.application.name=Avance_03_Rest
server.port=${PORT:8080}

# Base de datos MySQL
# Railway inyecta automáticamente MYSQLHOST, MYSQLPORT, MYSQLUSER,
# MYSQLPASSWORD y MYSQLDATABASE al enlazar el servicio de base de datos.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:citasMedicas}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:1321}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

server.compression.enabled=true
server.compression.mime-types=application/json,application/javascript,text/css,text/html,text/plain
server.compression.min-response-size=1024

# Correo SMTP (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT
app.jwt.secret=${JWT_SECRET:clave-secreta-temporal-para-desarrollo}
app.jwt.expiration-ms=7200000

# Admin inicial (creado por el DataInitializer)
app.admin.correo=${ADMIN_CORREO:admin123@gmail.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# CORS (Angular)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# OAuth2 Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

# URL de Angular que recibe el token tras el login con Google
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:4200/auth/oauth2-redirect}
